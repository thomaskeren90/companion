version: '3.8'

services:
  companion:
    build: ./backend
    container_name: companion-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ADMIN_KEY=${ADMIN_KEY}
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-https://yourdomain.com}
    volumes:
      - ./data:/app/data          # SQLite DB persists here
      - ./backend:/app
      - /app/node_modules
    command: node server.js

  nginx:
    image: nginx:alpine
    container_name: companion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/public:/usr/share/nginx/html
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - companion

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Run manually: docker-compose run certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
